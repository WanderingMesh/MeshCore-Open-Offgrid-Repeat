; Local-only PlatformIO overrides for MeshCore companion-v1.18.0 (81dbae59),
; for use with patches 0001 and 0002 in this folder.
;
; This file is gitignored and is pulled in automatically by the "extra_configs"
; directive in the root platformio.ini, so nothing in the tracked tree has to
; change to use these envs. That matters here: keeping the customisation out of
; variants/rak4631/platformio.ini means upstream pulls never conflict.

; ---------------------------------------------------------------------------
; RAK4631 BLE companion, off-grid (client repeat) mode unlocked in-band.
; ---------------------------------------------------------------------------
;
; WHY THIS EXISTS
;
; Stock companion firmware only permits off-grid/repeat mode on three fixed
; frequencies (433.000, 869.495, 918.000 MHz). Enabling repeat therefore drags
; the whole mesh onto one of those frequencies, so every other companion in the
; group has to be reconfigured by hand. For a large deployed team (SAR, etc.)
; that is slow and a reliable source of misconfiguration, and it cannot be
; undone once people are in the field.
;
; This flag does two things in examples/companion_radio/MyMesh.cpp:
;
;  - 0001: selects the 902-928 MHz US/Canada ISM band branch of the
;    repeat_freq_ranges[] table.
;  - 0002: keeps that band bound on the paths 1.18.0 added. The new companion
;    CLI's `set radio` (app Command Line, remote CLI, USB) never consults the
;    table, so while repeat is on an out-of-range `set radio` is refused, and
;    repeat is switched off at boot if the saved frequency is out of range.
;
; Every other env is untouched and keeps the upstream three-frequency
; restriction.
;
; WHY A RANGE RATHER THAN MORE FIXED POINTS
;
; The companion protocol already models this as {lower, upper} pairs, which
; the device reports via CMD_GET_ALLOWED_REPEAT_FREQ. Clients that fetch that
; list and validate against it (MeshCore Open build 17+) then accept whatever
; frequency the group is already using. Clients that hardcode the stock list do
; not; see the README for what is known per client.
;
; WHY A GATE FLAG INSTEAD OF THE ALLOWED_REPEAT_FREQ_RANGE HOOK
;
; MyMesh.cpp has an ALLOWED_REPEAT_FREQ_RANGE hook that looks like it was meant
; for precisely this, but it cannot carry a {lower,upper} pair from here: SCons
; splits -D values on commas, so the pair arrives as two separate defines and
; the table silently collapses to a single bogus 928000..0 range that matches
; no frequency at all. It compiles cleanly, which makes the breakage easy to
; miss, so the range lives in the source and this flag only selects it.
;
; NOTE: upstream restricts companion repeat on purpose, because client
; repeating is harmful on large public meshes. This build is for isolated,
; self-contained meshes. The distinct env name keeps that visible in the
; output artifact filename.

[env:RAK_4631_companion_radio_ble_offgrid]
extends = env:RAK_4631_companion_radio_ble
build_flags =
  ${env:RAK_4631_companion_radio_ble.build_flags}
  -D OFFGRID_ALLOW_US915_BAND=1
