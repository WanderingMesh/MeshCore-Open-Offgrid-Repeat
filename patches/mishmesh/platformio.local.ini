; Local-only PlatformIO overrides for MishMesh.
;
; This file is gitignored and is pulled in automatically by the "extra_configs"
; directive in the root platformio.ini, so nothing in the tracked tree has to
; change to use these envs. That keeps the customisation out of
; variants/wio-tracker-l1/platformio.ini, so upstream pulls never conflict.

; ---------------------------------------------------------------------------
; Wio Tracker L1 BLE companion, off-grid repeat unlocked across the band.
; ---------------------------------------------------------------------------
;
; WHY THIS EXISTS
;
; Stock firmware only permits off-grid repeat on three fixed frequencies
; (433.000, 869.495, 918.000 MHz). Enabling repeat therefore drags the whole
; mesh onto one of those, so every other companion has to be reconfigured by
; hand. For a large deployed team (SAR, etc.) that is slow, a reliable source of
; misconfiguration, and hard to undo once people are in the field.
;
; This flag does two things in the source:
;   1. Widens repeat_freq_ranges[] in examples/companion_radio/MyMesh.cpp to the
;      whole 902-928 MHz US/Canada ISM band, which is what isValidClientRepeatFreq()
;      checks for both the phone-app path and the on-device path.
;   2. Narrows repeat_freq_presets[] to the single US off-grid shortcut (918.000),
;      since 433 and 869.495 are not usable here.
;
; Every other env is untouched and keeps the upstream three-frequency behaviour.
;
; WHY THE FLAG CARRIES NO COMMA
;
; MyMesh.cpp has an ALLOWED_REPEAT_FREQ_RANGE hook that looks like it was meant
; for precisely this, but it cannot carry a {lower,upper} pair from here: SCons
; splits -D values on commas, so the pair arrives as two separate defines and
; the table silently collapses to a single bogus 928000..0 range that matches no
; frequency at all. It compiles cleanly, which makes the breakage easy to miss,
; so the range lives in the source and this flag only selects it.
;
; NOTE: upstream restricts companion repeat on purpose, because client repeating
; is harmful on large public meshes. This build is for isolated, self-contained
; meshes. The distinct env name keeps that visible in the artifact filename.
;
; The name must still END in "_mishmesh": build.sh matches on that suffix to pick
; the dual-version (mm/mc) naming branch and to pass -DMISHMESH_VERSION, which the
; About screen reads. "..._mishmesh_offgrid" silently falls through to the plain
; MeshCore branch instead, so the suffix order here is deliberate.

[env:WioTrackerL1_companion_radio_ble_offgrid_mishmesh]
extends = env:WioTrackerL1_companion_radio_ble_mishmesh
build_flags =
  ${env:WioTrackerL1_companion_radio_ble_mishmesh.build_flags}
  -D OFFGRID_ALLOW_US915_BAND=1
